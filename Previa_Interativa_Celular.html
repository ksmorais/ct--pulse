<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CT Pulse Mobile • Prévia interativa</title><style>
:root{--g:#153d36;--o:#f07347;--ink:#172b27;--muted:#72817b;--bg:#f5f6f3;--line:#e7ece8}*{box-sizing:border-box}body{background:#dfe6df;color:var(--ink);font:14px/1.5 system-ui,-apple-system,Segoe UI,Arial,sans-serif;margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}#app{width:min(100%,460px);margin:auto;background:var(--bg);min-height:100dvh;box-shadow:0 5px 35px #13211c1a;padding-bottom:80px}.top{height:73px;padding:14px 18px;background:var(--g);color:#fff;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px}.mark{background:var(--o);border-radius:10px;width:39px;height:39px;display:grid;place-items:center;font-size:17px;font-weight:900}.brand b{font-size:16px;letter-spacing:.3px}.brand small{display:block;color:#c2dacf;font-size:10px}.switch{border:1px solid #588376;background:#2c574b;color:#fff;padding:9px;border-radius:9px;font-size:11px}.body{padding:20px 17px}.hero{padding:22px;border-radius:18px;background:linear-gradient(125deg,#153d36,#275548);color:white;margin-bottom:15px}.hero small{text-transform:uppercase;letter-spacing:1.4px;font-size:10px;color:#c0dbcc}.hero h1{font-size:26px;letter-spacing:-1px;margin:8px 0}.hero p{color:#cee0d6;font-size:12px;margin:0}.title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:18px 0 11px}.title h2{font-size:21px;letter-spacing:-.5px;line-height:1.1;margin:0}.title p{color:var(--muted);font-size:12px;margin:4px 0}.card{background:#fff;border-radius:16px;border:1px solid var(--line);padding:15px;margin-bottom:12px;box-shadow:0 3px 18px #263c3010}.card h3{font-size:16px;margin:0 0 6px}.muted{color:var(--muted)}.small{font-size:12px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stats .card{min-height:98px}.stats strong{font-size:27px;display:block;color:var(--g);line-height:1.3;margin-top:10px}.row{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid #eff2ef}.row:last-child{border-bottom:none}.row .em{font-size:22px;width:30px;text-align:center}.row .grow{flex:1;min-width:0}.row b{display:block;font-size:13px}.row small{display:block;color:var(--muted);font-size:11px;margin-top:3px;line-height:1.4}.btn{background:var(--g);color:#fff;border:1px solid var(--g);padding:11px 12px;border-radius:10px;font-size:12px;font-weight:800}.btn.alt{background:#fff;border-color:#cbd9ce;color:var(--g)}.btn.danger{border-color:#f5d6d0;background:#fff3f0;color:#b94d46}.btn.sm{padding:8px 10px;font-size:11px}.btn.full{width:100%}.buttons{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.tag{display:inline-flex;background:#e7f5eb;border-radius:40px;color:#19704c;padding:4px 9px;font-weight:850;font-size:10px}.tag.orange{background:#fff1e7;color:#a55b28}.tag.red{background:#ffebea;color:#b13b3b}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,460px);background:white;border-top:1px solid var(--line);height:72px;display:flex;justify-content:space-around;align-items:stretch;z-index:10;box-shadow:0 -7px 24px #172b2712}.nav{flex:1;border:0;background:transparent;color:#89968e;font-size:10px;font-weight:700;position:relative;min-width:0}.nav.active{color:var(--g);background:#eff7f0}.nav span{display:block;font-size:20px;line-height:25px}.dot{position:absolute;top:7px;right:16px;background:var(--o);width:7px;height:7px;border-radius:50%}.loginhead{background:var(--g);color:#fff;text-align:center;padding:50px 18px 35px;border-radius:0 0 24px 24px}.loginhead .mark{margin:0 auto 13px;width:72px;height:72px;border-radius:19px;font-size:29px}.loginhead h1{letter-spacing:3px;font-size:33px;margin:0}.loginhead p{color:#bed4cb;margin:7px 0 0}.login{padding:22px}.login h2{font-size:23px;margin:2px 0 0}.field{display:block;margin:13px 0}.field b{display:block;font-size:12px;margin:0 0 6px}.field input,.field textarea,.field select{display:block;border:1px solid #dae3dc;background:white;border-radius:9px;padding:12px 11px;width:100%;color:var(--ink)}.field textarea{min-height:95px}.demo{display:flex;gap:11px;align-items:center;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;width:100%;margin:9px 0;padding:12px}.demo .em{font-size:24px}.demo .grow{flex:1}.demo b{display:block}.demo small{color:var(--muted);display:block;font-size:11px}.chips{display:flex;flex-wrap:wrap;gap:6px;margin:9px 0 12px}.chip{border:1px solid #d7e1d9;background:#fff;border-radius:25px;padding:8px 12px;font-size:11px;color:var(--g);font-weight:700}.chip.sel{background:var(--g);color:#fff}.modalback{position:fixed;inset:0;background:#0008;z-index:50;display:grid;align-items:end;justify-items:center}.modal{background:var(--bg);border-radius:25px 25px 0 0;width:min(100%,460px);max-height:90dvh;overflow-y:auto;padding:21px}.modalhead{display:flex;align-items:center;justify-content:space-between}.modalhead h2{margin:0}.modalhead button{font-size:25px;background:none;border:none;color:#789}.notice{background:#eaf5ec;padding:11px 13px;border-radius:12px;font-size:12px;color:#28624b;margin-bottom:14px}.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);width:calc(min(100%,460px) - 34px);background:#2a7956;color:#fff;border-radius:11px;padding:11px 14px;text-align:center;font-weight:700;z-index:70}.toggle{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:10px 0;gap:8px}.toggle input{accent-color:var(--g);width:22px;height:22px}.pillbox{display:flex;flex-direction:column;gap:10px}.panelInfo{font-size:12px;background:#fff4ec;color:#7c4c2c;padding:11px 13px;border-radius:11px;margin:10px 0}a{color:inherit}@media(min-width:520px){body{padding:32px 0}.bottom{bottom:0;box-shadow:0 -5px 22px #0001}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head><body><div id="app"></div><script>
const K='ctpulse_mobile_preview_v1';const roles={admin:{name:'Administração',email:'admin@ctpulse.com',pw:'admin123',label:'Administrador'},teacher:{name:'Prof. Diego',email:'prof@ctpulse.com',pw:'prof123',label:'Professor'},student:{name:'Marina Costa',email:'aluno@ctpulse.com',pw:'aluno123',label:'Aluno'}};const day=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}, month=()=>day().slice(0,7), addDay=(v,n)=>{let d=new Date(v+'T12:00:00');d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const dateFmt=v=>v?new Date(v+'T12:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'short'}):'—',money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),days=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];const newid=pre=>pre+Date.now().toString(36)+Math.random().toString(36).slice(2,6);const h=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');const el=(id)=>document.getElementById(id);
function nextClass(ds){for(let n=1;n<9;n++){const d=addDay(day(),n);if(ds.includes(new Date(d+'T12:00:00').getDay()))return d}return addDay(day(),1)}
function defaults(){return{students:[{id:'s1',name:'Marina Costa',email:'aluno@ctpulse.com',belt:'Branca',plan:159,active:true},{id:'s2',name:'João Martins',email:'joao@exemplo.com',belt:'Amarela',plan:179,active:true},{id:'s3',name:'Ana Ribeiro',email:'ana@exemplo.com',belt:'Branca',plan:159,active:true}],classes:[{id:'c1',name:'Muay Thai • Iniciante',teacher:'Prof. Diego',days:[1,3,5],time:'18:00',capacity:16},{id:'c2',name:'Muay Thai • Intermediário',teacher:'Prof. Diego',days:[2,4],time:'19:00',capacity:12},{id:'c3',name:'Técnica e Condicionamento',teacher:'Prof. Lucas',days:[6],time:'09:00',capacity:18}],enrollments:[{sid:'s1',cid:'c1'},{sid:'s2',cid:'c2'},{sid:'s3',cid:'c1'}],bookings:[{id:'b1',sid:'s1',cid:'c1',date:nextClass([1,3,5])}],attendance:[{id:'f1',sid:'s1',cid:'c1',date:addDay(day(),-2),present:true},{id:'f2',sid:'s1',cid:'c1',date:addDay(day(),-5),present:true},{id:'f3',sid:'s1',cid:'c1',date:addDay(day(),-7),present:false}],payments:[{id:'p1',sid:'s1',month:month(),amount:159,due:month()+'-20',status:'pending'},{id:'p2',sid:'s2',month:month(),amount:179,due:month()+'-20',status:'pending'},{id:'p3',sid:'s3',month:month(),amount:159,due:month()+'-20',status:'paid'}],grades:[{id:'g1',sid:'s1',belt:'Branca',date:addDay(day(),-60),note:'Início dos treinos'}],broadcasts:[{id:'a1',title:'Treino especial de sábado',body:'Teremos uma aula de técnica e condicionamento. Confirme presença no aplicativo!',type:'aula',author:'Prof. Diego',date:day()}],inbox:[{id:'n1',sid:'s1',title:'Treino especial de sábado',body:'Teremos uma aula de técnica e condicionamento. Confirme presença no aplicativo!',type:'aula',date:day(),read:false}],emails:[],prefs:{push:true,email:true,pay:true,classes:true,announcements:true}}}
let db;try{db=JSON.parse(localStorage.getItem(K))||defaults()}catch{db=defaults()}let user=null,tab='home',classSelected='c1',modal=null,noticeType='aula',audience='all',belt='Amarela',noticeForm={},form={};let email='aluno@ctpulse.com',pw='aluno123',selectedDays=[1,3,5];const save=()=>{try{localStorage.setItem(K,JSON.stringify(db))}catch(e){/* A prévia continua funcionando quando armazenamento local não estiver disponível. */}};const enrolled=(sid,cid)=>db.enrollments.some(x=>x.sid===sid&&x.cid===cid);const cls=id=>db.classes.find(x=>x.id===id);const stu=id=>db.students.find(x=>x.id===id);const bill=id=>db.payments.find(x=>x.sid===id&&x.month===month());const unread=()=>db.inbox.filter(n=>n.sid==='s1'&&!n.read).length;
function toast(s){let d=document.createElement('div');d.className='toast';d.textContent=s;document.body.append(d);setTimeout(()=>d.remove(),2300)}function tag(s,kind=''){return `<span class="tag ${kind}">${h(s)}</span>`}function heading(s,sub='',action=''){return `<div class="title"><div><h2>${s}</h2>${sub?`<p>${sub}</p>`:''}</div>${action}</div>`}function btn(s,act,kind='',extra=''){return `<button type="button" class="btn ${kind}" data-act="${act}" ${extra}>${s}</button>`}function row(ic,t,sub,right=''){return `<div class="row"><span class="em">${ic}</span><div class="grow"><b>${h(t)}</b><small>${h(sub)}</small></div>${right}</div>`}
function home(){const st=stu('s1'),p=bill('s1');return `<div class="hero"><small>CT Pulse • Muay Thai</small><h1>Olá, ${user==='student'?'Marina':user==='teacher'?'Professor':'Equipe'}! 👋</h1><p>${user==='student'?'Sua evolução começa a cada treino.':user==='teacher'?'Organize aulas, presenças e converse com alunos.':'Controle seu CT em um só lugar.'}</p></div><div class="stats"><div class="card"><span class="small muted">${user==='student'?'Minha graduação':'Alunos ativos'}</span><strong>${user==='student'?st.belt:db.students.filter(x=>x.active).length}</strong></div><div class="card"><span class="small muted">${user==='student'?'Aulas reservadas':'Turmas'}</span><strong>${user==='student'?db.bookings.filter(x=>x.sid==='s1').length:db.classes.length}</strong></div></div>`+(user==='student'?`${heading('Sua próxima aula','Acompanhe seus treinos')}<div class="card">${db.bookings.filter(x=>x.sid==='s1').slice(0,2).map(b=>row('🥊',cls(b.cid)?.name||'Turma',`${dateFmt(b.date)} • ${cls(b.cid)?.time}`)).join('')||'<p class="muted">Nenhum agendamento.</p>'}${btn('Ver agenda →','tab:schedule','alt full')}</div>${heading('Mensalidade')}<div class="card">${row('💳',p.status==='paid'?'Tudo em dia':`Vence em ${dateFmt(p.due)}`,money(p.amount),tag(p.status==='paid'?'Paga':'Pendente',p.status==='paid'?'':'orange'))}${btn('Ver mensalidade','tab:finance','alt full')}</div>${heading('Último aviso')}<div class="card">${db.inbox.filter(x=>x.sid==='s1').slice(0,1).map(x=>row('🔔',x.title,x.body)).join('')}${btn('Central de avisos','tab:news','alt full')}</div>`:`${heading('Resumo operacional')}<div class="card">${row('📋','Chamada de hoje','Registre presença nas turmas',btn('Abrir','tab:attendance','alt sm'))}${row('📣','Comunicados','Envie um aviso aos alunos',btn('Criar aviso','newNotice','alt sm'))}${user==='admin'?row('💳','Financeiro',`${db.payments.filter(x=>x.status==='pending').length} mensalidades pendentes`,btn('Ver','tab:finance','alt sm')):''}</div>`)}
function students(){return `${heading('Alunos','Gestão dos cadastros',btn('+ Novo','newStudent','sm'))}<div class="card">${db.students.map(s=>row('👤',s.name,`${s.email} • ${s.belt} • ${s.active?'Ativo':'Inativo'}`,`<div class="pillbox">${btn('Editar','editStudent:'+s.id,'alt sm')}${btn('Desativar','deactivate:'+s.id,'danger sm')}</div>`)).join('')}</div>${heading('Graduação','Atualize a evolução dos alunos')}<div class="card">${db.students.filter(s=>s.active).map(s=>row('🏅',s.name,`Graduação: ${s.belt}`,btn('Atualizar','grade:'+s.id,'alt sm'))).join('')}</div>`}
function classes(){return `${heading('Turmas e horários',user==='student'?'Inscreva-se e agende aulas':'Grade de treinamentos',user==='admin'?btn('+ Nova','newClass','sm'):'')}${db.classes.map(c=>`<div class="card"><div style="display:flex;justify-content:space-between">${tag(c.days.map(n=>days[n]).join(' • '))}<small class="muted">${c.capacity-db.enrollments.filter(x=>x.cid===c.id).length} vagas</small></div><h3 style="margin-top:13px">${h(c.name)}</h3><p class="small muted">🕒 ${c.time} &nbsp; • &nbsp; 👤 ${h(c.teacher)}</p><div class="buttons">${user==='student'?(enrolled('s1',c.id)?btn('Sair da turma','enroll:'+c.id,'alt')+btn('Agendar aula','book:'+c.id):btn('Inscrever-se','enroll:'+c.id)):(user==='admin'?btn('Editar turma','editClass:'+c.id,'alt'):'<small class="muted">Turma disponível para chamadas.</small>')}</div></div>`).join('')}`}
function schedule(){return `${heading('Minha agenda','Próximos agendamentos')}<div class="card">${db.bookings.filter(x=>x.sid==='s1').map(b=>row('📅',`${dateFmt(b.date)} • ${cls(b.cid)?.time}`,cls(b.cid)?.name,btn('Cancelar','cancel:'+b.id,'danger sm'))).join('')||'<p class="muted">Você ainda não agendou nenhuma aula.</p>'}</div>${heading('Minha grade')}<div class="card">${db.classes.filter(c=>enrolled('s1',c.id)).map(c=>row('🥊',c.name,`${c.days.map(x=>days[x]).join(', ')} • ${c.time}`)).join('')}</div>${heading('Minha frequência')}<div class="card"><div class="stats"><div><small class="muted">Presenças</small><strong style="display:block;font-size:24px;color:var(--g)">${db.attendance.filter(x=>x.sid==='s1'&&x.present).length}</strong></div><div><small class="muted">Faltas</small><strong style="display:block;font-size:24px;color:var(--g)">${db.attendance.filter(x=>x.sid==='s1'&&!x.present).length}</strong></div></div>${db.attendance.filter(x=>x.sid==='s1').map(a=>row(a.present?'✅':'❌',dateFmt(a.date),a.present?'Presença confirmada':'Falta registrada')).join('')}</div>`}
function attendance(){return `${heading('Chamada',`Registro de presença • ${dateFmt(day())}`)}<div class="chips">${db.classes.map(c=>`<button class="chip ${classSelected===c.id?'sel':''}" data-act="selectedClass:${c.id}">${h(c.name)}</button>`).join('')}</div><div class="card">${db.students.filter(s=>s.active&&enrolled(s.id,classSelected)).map(s=>{const a=db.attendance.find(x=>x.sid===s.id&&x.cid===classSelected&&x.date===day());return row('👤',s.name,a?.present?'Presente':a?'Falta registrada':'Ainda não registrado',btn(a?.present?'✓ Presente':'Marcar presença','present:'+s.id,'alt sm'))}).join('')||'<p class="muted">Não há alunos inscritos.</p>'}</div>`}
function finance(){if(user==='student'){const p=bill('s1');return `${heading('Minha mensalidade','Acompanhe seu pagamento')}<div class="card">${tag(p.status==='paid'?'Paga':'Pendente',p.status==='pending'?'orange':'')}<div style="font-size:36px;color:var(--g);font-weight:900;margin:12px 0 3px">${money(p.amount)}</div><p class="muted small">Vencimento: ${dateFmt(p.due)} • Referência ${h(p.month)}</p>${p.status==='pending'?btn('Simular pagamento','pay:'+p.id,'full'):'<p style="color:#28744f;font-weight:700">Pagamento demonstrativo registrado ✓</p>'}</div><div class="card">${row('📨','Lembretes de mensalidade','Prévia de e-mails e alertas de cobrança')}${btn('Testar lembrete de pagamento','demoNotice','alt full')}</div>`}return `${heading('Financeiro','Pagamentos e lembretes')}<div class="card">${db.payments.map(p=>row('💳',stu(p.sid)?.name||'Aluno',`${money(p.amount)} • Vence ${dateFmt(p.due)}`,p.status==='paid'?tag('Pago'):btn('Registrar','pay:'+p.id,'alt sm'))).join('')}</div><div class="card"><h3>Lembretes por e-mail</h3><p class="muted small">Prévia para avaliação. Nenhum e-mail é enviado automaticamente nesta demonstração.</p>${btn('Preparar e-mails pendentes','emails','full')}${db.emails.map(e=>`<div class="row"><span class="em">✉️</span><div><b>${h(e.subject)}</b><small>${h(e.to)} • Simulado</small><p class="small">${h(e.body)}</p></div></div>`).join('')}</div>`}
function news(){return `${heading(user==='student'?'Avisos e notificações':'Comunicados',user==='student'?'Mensagens do professor e do CT':'Publique informações para os alunos',user!=='student'?btn('+ Enviar','newNotice','sm'):'')}${user==='student'?`<div class="card">${db.inbox.filter(x=>x.sid==='s1').map(n=>`<button data-act="read:${n.id}" style="text-align:left;border:0;background:none;width:100%;padding:0">${row(n.type==='pagamento'?'💳':n.type==='aula'?'🥊':'📣',n.title,`${n.body} • ${dateFmt(n.date)}`,n.read?'':'<span class="dot" style="position:static"></span>')}</button>`).join('')||'<p class="muted">Nenhum aviso.</p>'}</div>`:`<div class="notice">Os avisos ficam disponíveis no perfil do aluno nesta simulação. Push real para outro celular requer backend.</div><div class="card">${db.broadcasts.map(a=>row('📣',a.title,`${a.author} • ${a.body}`)).join('')}</div>`}`}
function profile(){const s=stu('s1');return `${heading('Meu perfil','Dados e evolução')}<div class="card">${row('👤',s.name,s.email)}${row('🥇','Graduação: '+s.belt,'Acompanhamento do professor')}${db.grades.filter(x=>x.sid==='s1').map(g=>row('🏅',g.belt,`${dateFmt(g.date)} • ${g.note}`)).join('')}</div>${heading('Notificações','Escolha quais avisos receber')}<div class="card">${[['push','Avisos no aplicativo'],['pay','Lembretes de mensalidade'],['email','Lembretes por e-mail (simulados)'],['classes','Lembretes de aulas'],['announcements','Comunicados do professor']].map(([k,t])=>`<label class="toggle"><span>${h(t)}</span><input type="checkbox" data-pref="${k}" ${db.prefs[k]?'checked':''}></label>`).join('')}<div class="buttons">${btn('Testar lembrete no app','demoNotice','alt full')}</div></div><div class="card">${btn('Restaurar dados de demonstração','reset','danger full')}</div>`}
function captureModalForm(){const f=document.querySelector('.modal form');if(!f)return;const data=Object.fromEntries(new FormData(f));if(modal==='notice')noticeForm={...noticeForm,...data};else form={...form,...data};}
function modalHtml(){if(!modal)return '';let inner='',title='';if(modal==='student'){title=form.id?'Editar aluno':'Novo aluno';inner=`<form id="studentForm">${input('name','Nome completo',form.name)}${input('email','E-mail',form.email,'email')}${input('plan','Mensalidade (R$)',form.plan||159,'number')}<button class="btn full">Salvar aluno</button></form>`}else if(modal==='class'){title=form.id?'Editar turma':'Nova turma';inner=`<form id="classForm">${input('name','Nome da turma',form.name)}${input('teacher','Professor',form.teacher||'Prof. Diego')}${input('time','Horário (HH:MM)',form.time||'18:00')}${input('capacity','Vagas',form.capacity||15,'number')}<b class="small">Dias da semana</b><div class="chips">${[1,2,3,4,5,6,0].map(d=>`<button type="button" class="chip ${selectedDays.includes(d)?'sel':''}" data-act="day:${d}">${days[d]}</button>`).join('')}</div><button class="btn full">Salvar turma</button></form>`}else if(modal==='grade'){title='Registrar graduação';inner=`<div class="chips">${['Branca','Amarela','Laranja','Verde','Azul','Marrom','Preta'].map(b=>`<button type="button" class="chip ${b===belt?'sel':''}" data-act="belt:${b}">${b}</button>`).join('')}</div><form id="gradeForm">${input('note','Observação da avaliação','Boa evolução técnica')}<button class="btn full">Registrar evolução</button></form>`}else if(modal==='notice'){title='Novo comunicado';inner=`<form id="noticeForm">${input('title','Título',noticeForm.title||'') }<label class="field"><b>Mensagem</b><textarea name="body" placeholder="Informação importante para os alunos" required>${h(noticeForm.body||'')}</textarea></label><b class="small">Tipo de aviso</b><div class="chips">${[['aula','🥊 Aula'],['pagamento','💳 Pagamento'],['geral','📣 Geral']].map(([v,t])=>`<button type="button" class="chip ${noticeType===v?'sel':''}" data-act="type:${v}">${t}</button>`).join('')}</div><b class="small">Destinatários</b><div class="chips">${[['all','Todos'],['s1','Marina'],...db.classes.map(c=>[c.id,c.name])].map(([v,t])=>`<button type="button" class="chip ${audience===v?'sel':''}" data-act="audience:${v}">${h(t)}</button>`).join('')}</div><div class="panelInfo">O professor publica a mensagem, que aparece na central de avisos do aluno. Envio a outros aparelhos requer um servidor de notificações.</div><button class="btn full">Publicar comunicado</button></form>`}return `<div class="modalback" id="modalback"><div class="modal"><div class="modalhead"><h2>${h(title)}</h2><button data-act="close">×</button></div>${inner}</div></div>`}
function input(name,label,value,type='text'){return `<label class="field"><b>${h(label)}</b><input required type="${type}" name="${name}" value="${h(value||'')}"></label>`}
function render(){const menus=user==='admin'?[['home','Início','⌂'],['students','Alunos','♟'],['classes','Turmas','▦'],['attendance','Chamada','✓'],['finance','Financeiro','R$'],['news','Avisos','✉']]:user==='teacher'?[['home','Início','⌂'],['classes','Turmas','▦'],['attendance','Chamada','✓'],['news','Avisos','✉']]:[['home','Início','⌂'],['classes','Turmas','▦'],['schedule','Agenda','▤'],['finance','Mensalidade','R$'],['news','Avisos','✉'],['profile','Perfil','♙']];if(!user){el('app').innerHTML=`<div class="loginhead"><div class="mark">CT</div><h1>CT PULSE</h1><p>Seu CT na palma da mão</p><p style="font-size:10px;letter-spacing:1.1px">PROTÓTIPO MOBILE • PROJETO INTEGRADOR III</p></div><div class="login"><h2>Bem-vindo de volta</h2><p class="muted small">Entre no seu painel.</p><form id="loginForm">${input('email','E-mail',email,'email')}${input('pw','Senha',pw,'text')}<button class="btn full" type="submit">Entrar no CT Pulse →</button></form><p class="small muted" style="text-align:center;margin-top:22px">CONTAS PARA DEMONSTRAÇÃO</p>${Object.entries(roles).map(([id,r])=>`<button class="demo" data-act="account:${id}"><span class="em">${id==='admin'?'🛡️':id==='teacher'?'🥊':'👤'}</span><span class="grow"><b>${r.label}</b><small>${r.email} • ${r.pw}</small></span><b>›</b></button>`).join('')}<p class="muted small" style="text-align:center;margin-top:20px">Dados fictícios e pagamentos simulados.</p></div>`;return;}const available={home,students,classes,schedule,attendance,finance,news,profile};if(!menus.some(x=>x[0]===tab))tab='home';el('app').innerHTML=`<div class="top"><div class="brand"><div class="mark">CT</div><div><b>CT PULSE</b><small>${roles[user].label} • Simulação</small></div></div><button class="switch" data-act="logout">Trocar perfil ⇄</button></div><div class="body">${available[tab]()}</div><nav class="bottom">${menus.map(([id,name,ic])=>`<button class="nav ${tab===id?'active':''}" data-act="tab:${id}"><span>${ic}</span>${name}${id==='news'&&user==='student'&&unread()?'<i class="dot"></i>':''}</button>`).join('')}</nav>${modalHtml()}`;save();}
function action(a){if(a.startsWith('tab:')){tab=a.slice(4);scrollTo(0,0);return render()}if(a==='logout'){user=null;tab='home';modal=null;return render()}if(a.startsWith('account:')){let r=roles[a.slice(8)];email=r.email;pw=r.pw;return render()}if(a==='newStudent'){form={name:'',email:'',plan:'159'};modal='student';return render()}if(a.startsWith('editStudent:')){form={...stu(a.slice(12))};modal='student';return render()}if(a.startsWith('deactivate:')){let s=stu(a.slice(11));if(confirm(`Desativar ${s.name}? O histórico será preservado.`)){s.active=false;toast('Aluno desativado');}return render()}if(a==='newClass'){form={name:'',teacher:'Prof. Diego',time:'18:00',capacity:15};selectedDays=[1,3,5];modal='class';return render()}if(a.startsWith('editClass:')){form={...cls(a.slice(10))};selectedDays=[...form.days];modal='class';return render()}if(a.startsWith('selectedClass:')){classSelected=a.slice(14);return render()}if(a.startsWith('day:')){captureModalForm();let d=+a.slice(4);selectedDays=selectedDays.includes(d)?selectedDays.filter(x=>x!==d):[...selectedDays,d];return render()}if(a.startsWith('enroll:')){let cid=a.slice(7);if(enrolled('s1',cid)){if(confirm('Sair da turma?')){db.enrollments=db.enrollments.filter(x=>!(x.sid==='s1'&&x.cid===cid));db.bookings=db.bookings.filter(x=>!(x.sid==='s1'&&x.cid===cid));toast('Inscrição removida')}}else{db.enrollments.push({sid:'s1',cid});db.inbox.unshift({id:newid('n'),sid:'s1',title:'Inscrição realizada',body:'Você foi inscrita na turma '+cls(cid).name,type:'aula',date:day(),read:false});toast('Inscrição confirmada')}return render()}if(a.startsWith('book:')){let cid=a.slice(5),c=cls(cid),date=nextClass(c.days);if(db.bookings.some(x=>x.cid===cid&&x.sid==='s1'&&x.date===date))toast('Aula já agendada');else{db.bookings.push({id:newid('b'),sid:'s1',cid,date});db.inbox.unshift({id:newid('n'),sid:'s1',title:'Aula agendada',body:`${c.name} em ${dateFmt(date)} às ${c.time}`,type:'aula',date:day(),read:false});toast('Aula agendada.')}return render()}if(a.startsWith('cancel:')){db.bookings=db.bookings.filter(x=>x.id!==a.slice(7));toast('Agendamento cancelado');return render()}if(a.startsWith('present:')){let sid=a.slice(8),x=db.attendance.find(x=>x.sid===sid&&x.cid===classSelected&&x.date===day());if(x)x.present=!x.present;else db.attendance.push({id:newid('f'),sid,cid:classSelected,date:day(),present:true});toast('Presença atualizada');return render()}if(a.startsWith('pay:')){let p=db.payments.find(x=>x.id===a.slice(4));if(confirm('Confirmar pagamento demonstrativo? Não há cobrança real.')){p.status='paid';p.paidAt=day();db.inbox.unshift({id:newid('n'),sid:p.sid,title:'Pagamento demonstrativo confirmado',body:money(p.amount),type:'pagamento',date:day(),read:false});toast('Pagamento simulado')}return render()}if(a==='emails'){let count=0;db.payments.filter(p=>p.status==='pending').forEach(p=>{if(db.emails.some(e=>e.key===p.id+month()))return;db.emails.unshift({key:p.id+month(),to:stu(p.sid).email,subject:'CT Pulse • Lembrete de mensalidade',body:`Olá, ${stu(p.sid).name}! Sua mensalidade de ${money(p.amount)} vence em ${dateFmt(p.due)}.`,date:day()});count++});toast(`${count} e-mail(s) de demonstração preparado(s)`);return render()}if(a==='newNotice'){modal='notice';noticeForm={};noticeType='aula';audience='all';return render()}if(a.startsWith('type:')){captureModalForm();noticeType=a.slice(5);return render()}if(a.startsWith('audience:')){captureModalForm();audience=a.slice(9);return render()}if(a.startsWith('read:')){db.inbox.find(x=>x.id===a.slice(5)).read=true;return render()}if(a.startsWith('grade:')){form={sid:a.slice(6)};belt='Amarela';modal='grade';return render()}if(a.startsWith('belt:')){captureModalForm();belt=a.slice(5);return render()}if(a==='close'){modal=null;return render()}if(a==='reset'){if(confirm('Restaurar os dados fictícios iniciais?')){db=defaults();toast('Protótipo restaurado')}return render()}if(a==='demoNotice'){db.inbox.unshift({id:newid('n'),sid:'s1',title:'Lembrete de demonstração',body:'Sua mensalidade e suas próximas aulas podem gerar alertas no aplicativo.',type:'pagamento',date:day(),read:false});toast('Notificação de exemplo criada');return render()}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;e.preventDefault();action(b.dataset.act)});document.addEventListener('change',e=>{if(e.target.dataset.pref){db.prefs[e.target.dataset.pref]=e.target.checked;save();toast('Preferência salva')}});document.addEventListener('submit',e=>{e.preventDefault();let f=e.target,d=Object.fromEntries(new FormData(f));if(f.id==='loginForm'){email=d.email;pw=d.pw;user=Object.entries(roles).find(([k,r])=>r.email===email&&r.pw===pw)?.[0]||null;if(!user){alert('Use uma conta de demonstração.');return}tab='home';if(user==='student'){let p=bill('s1');if(p?.status==='pending'&&!db.inbox.some(x=>x.key===`due_${p.month}`)){db.inbox.unshift({id:newid('n'),key:`due_${p.month}`,sid:'s1',title:'Lembrete de mensalidade',body:`Mensalidade de ${money(p.amount)} vence em ${dateFmt(p.due)}.`,type:'pagamento',date:day(),read:false})}}return render()}if(f.id==='studentForm'){if(!d.name||!d.email.includes('@'))return alert('Informe nome e e-mail.');if(form.id){Object.assign(stu(form.id),{name:d.name,email:d.email,plan:+d.plan})}else{const id=newid('s');db.students.push({id,name:d.name,email:d.email,belt:'Branca',plan:+d.plan,active:true});db.payments.push({id:newid('p'),sid:id,month:month(),amount:+d.plan,due:month()+'-20',status:'pending'})}modal=null;toast('Aluno salvo');return render()}if(f.id==='classForm'){if(!d.name||!d.time||!selectedDays.length)return alert('Preencha nome, horário e dias.');let payload={name:d.name,teacher:d.teacher,time:d.time,capacity:+d.capacity,days:selectedDays};if(form.id)Object.assign(cls(form.id),payload);else db.classes.push({id:newid('c'),...payload});modal=null;toast('Turma salva');return render()}if(f.id==='gradeForm'){stu(form.sid).belt=belt;db.grades.unshift({id:newid('g'),sid:form.sid,belt,date:day(),note:d.note||'Avaliação'});db.inbox.unshift({id:newid('n'),sid:form.sid,title:'Evolução de graduação',body:`Nova graduação: ${belt}`,type:'geral',date:day(),read:false});modal=null;toast('Graduação registrada');return render()}if(f.id==='noticeForm'){const dest=audience==='all'?db.students.filter(x=>x.active):audience==='s1'?[stu('s1')]:db.students.filter(x=>enrolled(x.id,audience));db.broadcasts.unshift({id:newid('a'),title:d.title,body:d.body,author:user==='teacher'?'Prof. Diego':'Administração',type:noticeType,date:day()});dest.forEach(s=>db.inbox.unshift({id:newid('n'),sid:s.id,title:d.title,body:d.body,type:noticeType,date:day(),read:false}));modal=null;toast(`Aviso publicado para ${dest.length} aluno(s)`);return render()}});render();
</script></body></html>
